<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>

<style>

    body {
        background: #e4f0ff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: 'Inter', sans-serif;
    }

    .box {
        background: white;
        padding: 50px 40px;
        border-radius: 18px;
        box-shadow: 0px 8px 25px rgba(0,0,0,0.13);
        text-align: center;
        max-width: 450px;
        width: 90%;
        animation: fadeIn 0.7s ease-in-out;
    }

    /* Tick animation */
    .checkmark {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: inline-block;
        border: 4px solid #2ecc71;
        position: relative;
        animation: pop 0.4s ease-out;
    }

    .checkmark::after {
        content: '';
        position: absolute;
        left: 22px;
        top: 12px;
        width: 18px;
        height: 38px;
        border-right: 4px solid #2ecc71;
        border-bottom: 4px solid #2ecc71;
        transform: rotate(45deg);
        animation: check 0.4s ease-out 0.3s backwards;
    }

    @keyframes pop {
        0% { transform: scale(0.3); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes check {
        from { height: 0; width: 0; }
        to { height: 38px; width: 18px; }
    }

    h1 {
        margin-top: 25px;
        color: #003366;
        font-size: 30px;
    }

    p {
        font-size: 18px;
        color: #555;
        margin-bottom: 30px;
    }

    .btn {
        display: block;
        padding: 14px;
        margin: 10px 0;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        font-size: 17px;
    }

    .home-btn {
        background: #003366;
        color: white;
    }

    .home-btn:hover {
        background: #001f4d;
    }

    .wa-btn {
        background: #25D366;
        color: white;
    }

    .wa-btn:hover {
        background: #1da851;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

</style>
</head>
<body>

<div class="box">
    <div class="checkmark"></div>
    <h1>Thank You!</h1>
    <p>Your appointment request has been received.<br>
    We will contact you shortly.</p>

    <!-- HOME BUTTON -->
    <a href="index.html" class="btn home-btn">Back to Home</a>

    <!-- WhatsApp Confirmation (Optional) -->
    <a href="https://wa.me/918962087556?text=Hello%2C%20I%20just%20booked%20an%20appointment.%20Thank%20you!"
       class="btn wa-btn">Message on WhatsApp</a>
</div>

</body>
</html>
