<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Appointment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e7f4ff;
            padding: 40px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .row input, .row select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #003366;
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #001f4d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Make Appointment</h2>

    <!-- START FORM -->
    <form action="https://formsubmit.co/argalabhinav02@gmail.com" method="POST">

        <!-- Disable CAPTCHA + set email table format -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_subject" value="New Appointment Request">

        <div class="row">
            <select name="Service" required>
                <option value="" disabled selected>Select A Service</option>
                <option>Teeth Cleaning</option>
                <option>Root Canal</option>
                <option>Braces</option>
                <option>Cosmetic Dentistry</option>
            </select>

            <select name="Doctor" required>
                <option value="" disabled selected>Select Doctor</option>
                <option>Dr. Sharma</option>
                <option>Dr. Verma</option>
                <option>Dr. Mehta</option>
            </select>
        </div>

        <div class="row">
            <input type="text" name="Name" placeholder="Your Name" required>
            <input type="email" name="Email" placeholder="Your Email" required>
        </div>

        <div class="row">
            <input type="date" name="Appointment Date" required>
            <input type="time" name="Appointment Time" required>
        </div>

        <button type="submit">Make Appointment</button>
    </form>
    <!-- END FORM -->

</div>

</body>
</html>
