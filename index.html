<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Appointment</title>

<style>
    body {
        font-family: 'Inter', sans-serif;
        background: #d9e9f7;
        margin: 0;
        padding: 40px;
    }

    .container {
        max-width: 820px;
        background: white;
        padding: 35px;
        margin: auto;
        border-radius: 14px;
        box-shadow: 0px 8px 25px rgba(0,0,0,0.15);
    }

    h2 {
        text-align: center;
        font-size: 32px;
        margin-bottom: 25px;
        color: #002b5c;
    }

    .row {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }

    .row input, .row select {
        width: 100%;
        padding: 14px;
        border-radius: 8px;
        border: 1px solid #bfc7d1;
        font-size: 16px;
        background: #f4f9ff;
    }

    button {
        width: 100%;
        padding: 16px;
        background: #003366;
        color: white;
        font-size: 20px;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #001f4d;
    }

    /* Success Popup */
    #successBox {
        display: none;
        position: fixed;
        top: 20px;
        right: 20px;
        background: #00b050;
        color: white;
        padding: 15px 25px;
        border-radius: 10px;
        font-size: 18px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
</style>
</head>
<body>

<div id="successBox">Appointment Submitted Successfully ✔</div>

<div class="container">
    <h2>Make Appointment</h2>

    <form id="appointmentForm">

        <div class="row">
            <select name="service" required>
                <option disabled selected>Select A Service</option>
                <option>Teeth Cleaning</option>
                <option>Root Canal</option>
                <option>Braces</option>
                <option>Cosmetic Dentistry</option>
            </select>

            <select name="doctor" required>
                <option disabled selected>Select Doctor</option>
                <option>Dr. Sharma</option>
                <option>Dr. Verma</option>
                <option>Dr. Mehta</option>
            </select>
        </div>

        <div class="row">
            <input type="text" name="name" placeholder="Your Name" required minlength="3">
            <input type="email" name="email" placeholder="Your Email" required>
        </div>

        <div class="row">
            <input type="date" name="date" required>
            <input type="time" name="time" required>
        </div>

        <button type="submit">Make Appointment</button>
    </form>
</div>

<script>

// YOUR GOOGLE SHEETS SCRIPT URL
const scriptURL = "https://script.google.com/macros/s/AKfycbzGUw788ZdgQhhXgWVfqudkp33F-BEAYzQ4PgCDAuR51gSJi8X83c-sn8ydvv3MFUel/exec";

// YOUR WHATSAPP NUMBER
const whatsappNumber = "918962087556";

// THANK-YOU PAGE
const thankYouURL = "thankyou.html";

document.getElementById("appointmentForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // FRONT-END VALIDATION
    if (!this.checkValidity()) {
        alert("Please fill all fields correctly!");
        return;
    }

    const formData = new FormData(this);
    const data = Object.fromEntries(formData);

    // SEND TO GOOGLE SHEETS
    fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(data)
    })
    .then(res => {

        // SHOW SUCCESS MESSAGE
        document.getElementById("successBox").style.display = "block";
        setTimeout(() => {
            document.getElementById("successBox").style.display = "none";
        }, 3000);

        // SEND WHATSAPP ALERT
        const waMessage = 
            `New Appointment:%0A` +
            `Service: ${data.service}%0A` +
            `Doctor: ${data.doctor}%0A` +
            `Name: ${data.name}%0A` +
            `Email: ${data.email}%0A` +
            `Date: ${data.date}%0A` +
            `Time: ${data.time}`;

        window.open(`https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${waMessage}`);

        // REDIRECT TO THANK YOU PAGE
        setTimeout(() => {
            window.location.href = thankYouURL;
        }, 1000);

    })
    .catch(err => alert("Error submitting form."));
});
</script>

</body>
</html>
