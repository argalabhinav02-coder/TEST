<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Video Cards</title>


<style>
body {
    background: url('background.avif') no-repeat center center fixed;
    font-family: 'Poppins', sans-serif;
background-size: cover;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    display: flex;
    gap: 25px;
}

.card {
    width: 300px;
    height: 170px;
    background: #111;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
    transition: 0.3s;
    position: relative;
}

.card:hover {
    transform: scale(1.08) rotateX(5deg);
    box-shadow: 0 0 25px rgba(255,255,255,0.7);
}

.thumbnail {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.title {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 6px 10px;
    background: rgba(0,0,0,0.6);
    font-size: 14px;
    color: #fff;
    text-align: center;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(6px);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.overlay iframe {
    width: 80%;
    height: 70vh;
    border: none;
}

.closeBtn {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: #fff;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <div class="card" onclick="openVideo('RG3Hqth0Eus')">
        <img src="https://img.youtube.com/vi/RG3Hqth0Eus/maxresdefault.jpg" class="thumbnail">
        <div class="title">RAMAYAN EP-1</div>
    </div>

    <div class="card" onclick="openVideo('UdLXlTC-bFY')">
        <img src="https://img.youtube.com/vi/UdLXlTC-bFY/maxresdefault.jpg" class="thumbnail">
        <div class="title">RAMAYAN EP-2</div>
    </div>

    <div class="card" onclick="openVideo('kHi1S_W4RQw')">
        <img src="https://img.youtube.com/vi/kHi1S_W4RQw/maxresdefault.jpg" class="thumbnail">
        <div class="title">RAMAYAN EP-3</div>
    </div>
</div>

<div class="overlay" id="playerOverlay">
    <span class="closeBtn" onclick="closeVideo()">×</span>
    <iframe id="videoFrame" allowfullscreen></iframe>
</div>

<script>
function openVideo(id) {
    document.getElementById("playerOverlay").style.display = "flex";
    document.getElementById("videoFrame").src =
        "https://www.youtube.com/embed/" + id + "?autoplay=1&rel=0&modestbranding=1";
}

function closeVideo() {
    document.getElementById("playerOverlay").style.display = "none";
    document.getElementById("videoFrame").src = "";
}
</script>

</body>
</html>
