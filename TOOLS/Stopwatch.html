<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stopwatch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Arial, sans-serif;
    min-height:100vh;
    background-image: url("background.png");
    background-size: cover;
    background-position: center;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CONTAINER */
.timer-container{
    width:100%;
    max-width:1000px;
    padding:10px;
    text-align:center;
}

/* DISPLAY */
.display{
    background:#000;
    border:5px solid #fff;
    border-radius:20px;
    font-size:200px;
    font-weight:bold;
    padding:20px 10px;
    color:#48ff00;
    line-height:1.1;
}

.ms{
    font-size:22px;
}

/* KEYPAD */
.keypad{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:12px;
    margin:25px 0;
}

.key{
    background:#fff;
    font-size:30px;
    font-weight:bold;
    border-radius:50px;
    padding:15px 0;
    border:4px solid #000;
}

/* CONTROLS */
.controls{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap:10px;
}

.btn{
    padding:14px;
    font-size:30px;
    font-weight:bold;
    border-radius:18px;
    cursor:pointer;
}

.set-btn{
    background:#5C16E9;
    color:#fff;
    border:2px solid #fff;
}

.pause-btn{
    background:#C616E9;
    color:#fff;
    border:2px solid #fff;
}

.clear-btn{
    background:#E916A3;
    color:#fff;
    border:2px solid #fff;
}

/* FULLSCREEN */
#fullscreenBtn{
    position:fixed;
    top:15px;
    right:15px;
    z-index:999;
    background:#000;
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 14px;
    font-size:20px;
    cursor:pointer;
}

/* FULLSCREEN MODE */
.fullscreen-mode .keypad,
.fullscreen-mode .controls,
.fullscreen-mode #fullscreenBtn{
    display:none;
}

.fullscreen-mode .display{
    font-size:11vw;
    padding:40px 20px;
}

/* ===================== */
/* 📱 MOBILE RESPONSIVE */
/* ===================== */

@media (max-width: 768px){
    .display{
        font-size:14vw;
        padding:18px 10px;
    }

    .ms{
        font-size:4vw;
    }

    .key{
        font-size:6vw;
        padding:14px 0;
    }

    .btn{
        font-size:5vw;
        padding:12px;
    }

    img{
        width:120px;
        height:auto;
    }
}

@media (max-width: 480px){
    .display{
        font-size:15vw;
        border-width:4px;
    }

    .keypad{
        gap:8px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .btn{
        width:100%;
    }

    #fullscreenBtn{
        font-size:16px;
        padding:8px 10px;
    }
}


.homepage-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: var(--color-dark);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .homepage-nav:hover {
            background-color: #E916A3;
            box-shadow: 0 6px 10px rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            color:#ffffff;
        }
        .homepage-nav i {
            margin-right: 8px;
        }
</style>
</head>

<body>
    <a href="index.html" class="homepage-nav">⏳ Countdown</a>
<button id="fullscreenBtn" onclick="toggleFullScreen()">⛶</button>

<div class="timer-container">
    <img src="https://www.viva24.online/img/vendor-1.png" height="200" width="200">

    <div class="display">
        <span id="time">00:00:00</span>
        <span class="ms" id="ms">000</span>
    </div>

  <BR>

    <div class="controls">
        <button class="btn set-btn" onclick="startStopwatch()">Start ▶</button>
        <button class="btn pause-btn" onclick="pauseResume()">Pause ⏸</button>
        <button class="btn clear-btn" onclick="resetStopwatch()">Reset ↺</button>
    </div>
</div>

<script>
let elapsedMs = 0;
let timer = null;
let paused = false;

function startStopwatch(){
    if(timer) return;
    timer = setInterval(runStopwatch, 10);
}

function runStopwatch(){
    if(paused) return;
    elapsedMs += 10;

    let ms = elapsedMs % 1000;
    let t = Math.floor(elapsedMs / 1000);
    let s = t % 60;
    let m = Math.floor(t / 60) % 60;
    let h = Math.floor(t / 3600);

    document.getElementById("time").innerText =
        `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    document.getElementById("ms").innerText = String(ms).padStart(3,'0');
}

function pauseResume(){
    if(!timer) return;
    paused = !paused;
    event.target.innerText = paused ? "Resume ⏯" : "Pause ⏸";
}

function resetStopwatch(){
    clearInterval(timer);
    timer = null;
    paused = false;
    elapsedMs = 0;
    document.getElementById("time").innerText = "00:00:00";
    document.getElementById("ms").innerText = "000";
    document.querySelector(".pause-btn").innerText = "Pause ⏸";
}

function toggleFullScreen(){
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen-mode");
    }else{
        document.exitFullscreen();
        document.body.classList.remove("fullscreen-mode");
    }
}

document.addEventListener("fullscreenchange", ()=>{
    if(!document.fullscreenElement){
        document.body.classList.remove("fullscreen-mode");
    }
});
</script>

</body>
</html>
