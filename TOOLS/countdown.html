<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Countdown Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:Arial, sans-serif;
    min-height:100vh;
    background-image: url("background.png");
    background-size: cover;
    background-position: center;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* FULL SCREEN CONTAINER */
.timer-container{
    width:100%;
    max-width:800px;
    padding:10px;
    text-align:center;
}

/* DISPLAY */
.display{
    background:#000000;
    border:5px solid #ffffff;
    border-radius:20px;
    font-size:130px;
    font-weight:bold;
    padding:20px 10px;
    color:#48ff00;
}

.ms{
    font-size:22px;
}

/* KEYPAD */
.keypad{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:12px;
    margin:25px 0;
}

.key{
    background:#ffffff;
    font-size:30px;
    font-weight:bold;
    border-radius:50px;
    padding:15px 0;
    border:4px solid #000;
    cursor:pointer;
}

.key:active{transform:scale(0.95);}

/* BUTTONS */
.controls{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap:10px;
}

.btn{
    padding:14px;
    font-size:30px;
    font-weight:bold;
    border-radius:18px;
    cursor:pointer;
}

.set-btn{
    background:#5C16E9;
    border:2px solid #ffffff;
    color:#ffffff;
    width:250px;
}

.pause-btn{
    background:#C616E9;
    border:2px solid #ffffff;
    color:#fff;
    width:250px;
}

.clear-btn{
    background:#E916A3;
    color:#fff;
    border:2px solid #ffffff;
    width:250px;
}

/* FULLSCREEN BUTTON */
#fullscreenBtn{
    position:fixed;
    top:15px;
    right:15px;
    z-index:999;
    background:#000;
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 14px;
    font-size:20px;
    cursor:pointer;
}

/* FULLSCREEN MODE */
.fullscreen-mode .keypad,
.fullscreen-mode .controls,
.fullscreen-mode #fullscreenBtn{
    display:none;
}

.fullscreen-mode .display{
    font-size:11vw;
    padding:40px 20px;
}
.fullscreen-mode{
    cursor:pointer;
}

/* =============================== */
/* 📱 MOBILE RESPONSIVE CSS ONLY */
/* =============================== */

@media (max-width: 768px){
    .display{
        font-size:14vw;
        padding:16px 10px;
    }

    .ms{
        font-size:4vw;
    }

    .key{
        font-size:6vw;
        padding:14px 0;
    }

    .btn{
        font-size:5vw;
        padding:12px;
    }

    img{
        width:120px;
        height:auto;
    }
}

@media (max-width: 480px){
    .display{
        font-size:15vw;
        border-width:4px;
    }

    .keypad{
        gap:8px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .btn{
        width:100%;
    }

    #fullscreenBtn{
        font-size:16px;
        padding:8px 10px;
    }
}
.homepage-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: var(--color-dark);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .homepage-nav:hover {
            background-color: #E916A3;
            box-shadow: 0 6px 10px rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            color:#ffffff;
        }
        .homepage-nav i {
            margin-right: 8px;
        }
</style>
</head>

<body>
    <a href="Stopwatch.html" class="homepage-nav">⏱️ StopWatch</a>
<button id="fullscreenBtn" onclick="toggleFullScreen()">⛶</button>

<div class="timer-container">
    <img src="https://www.viva24.online/img/vendor-1.png" height="150px" width="150px">

    <div class="display">
        <span id="time">00:00:00</span>
        <span class="ms" id="ms">000</span>
    </div>

    <div class="keypad">
        <div class="key" onclick="addDigit(5)">5</div>
        <div class="key" onclick="addDigit(6)">6</div>
        <div class="key" onclick="addDigit(7)">7</div>
        <div class="key" onclick="addDigit(8)">8</div>
        <div class="key" onclick="addDigit(9)">9</div>

        <div class="key" onclick="addDigit(0)">0</div>
        <div class="key" onclick="addDigit(1)">1</div>
        <div class="key" onclick="addDigit(2)">2</div>
        <div class="key" onclick="addDigit(3)">3</div>
        <div class="key" onclick="addDigit(4)">4</div>
    </div>

    <div class="controls">
        <button class="btn set-btn" onclick="startTimer()">Set / Start ▶</button>
        <button class="btn pause-btn" onclick="pauseResume()">Pause ⏸</button>
        <button class="btn clear-btn" onclick="clearTimer()">Clear ↺</button>
    </div>
</div>


<!-- ALARM SOUND -->
<audio id="alarm">
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>
let input="";
let totalMs=0;
let timer=null;
let paused=false;

function addDigit(d){
    if(timer) return;
    if(input.length<6){
        input+=d;
        updateDisplay();
    }
}

function updateDisplay(){
    let p=input.padStart(6,'0');
    document.getElementById("time").innerText =
        `${p.slice(0,2)}:${p.slice(2,4)}:${p.slice(4,6)}`;
}

function startTimer(){
    if(timer) return;
    let p=input.padStart(6,'0');
    let h=+p.slice(0,2), m=+p.slice(2,4), s=+p.slice(4,6);
    totalMs=(h*3600+m*60+s)*1000;

    timer=setInterval(runTimer,10);
}

function runTimer(){
    if(paused) return;

    if(totalMs<=0){
        clearInterval(timer);
        timer=null;
        document.getElementById("alarm").play();
        return;
    }

    totalMs-=10;
    let ms=totalMs%1000;
    let t=Math.floor(totalMs/1000);
    let s=t%60, m=Math.floor(t/60)%60, h=Math.floor(t/3600);

    document.getElementById("time").innerText=
        `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    document.getElementById("ms").innerText=String(ms).padStart(3,'0');
}

function pauseResume(){
    if(!timer) return;
    paused=!paused;
    event.target.innerText=paused?"Resume ⏯":"Pause ⏸";
}

function clearTimer(){
    clearInterval(timer);
    timer=null;
    paused=false;
    input="";
    document.getElementById("time").innerText="00:00:00";
    document.getElementById("ms").innerText="000";
    document.querySelector(".pause-btn").innerText="Pause";
}
</script>
<script>
function toggleFullScreen(){
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen-mode");
    }else{
        document.exitFullscreen();
        document.body.classList.remove("fullscreen-mode");
    }
}

/* Detect ESC / swipe exit */
document.addEventListener("fullscreenchange", ()=>{
    if(!document.fullscreenElement){
        document.body.classList.remove("fullscreen-mode");
    }
});
</script>
<script>
document.addEventListener("click", function(e){
    if(document.fullscreenElement){
        /* prevent button clicks from immediately exiting */
        if(e.target.id !== "fullscreenBtn"){
            document.exitFullscreen();
        }
    }
});
</script>

</body>
</html>
