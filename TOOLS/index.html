  <input id="searchInput" placeholder="Search tools or categories...">

<button class="pill" onclick="setCategory('video-ai', this)">🎥 Video AI</button>
<button class="pill" onclick="setCategory('timers', this)">⏱ Timers</button>



</div>

<!-- TOOLS -->
<div id="toolsGrid" class="tools-grid"></div>

<footer>© 2026 • Designed by Abhinav</footer>

  }
  
];


let activeCategory = "all";

/* ===== RENDER ===== */
function render() {
  const grid = document.getElementById("toolsGrid");
  const q = document.getElementById("searchInput").value.toLowerCase();
  grid.innerHTML = "";

  const filtered = tools.filter(t =>
    (activeCategory === "all" || t.category === activeCategory) &&
    t.name.toLowerCase().includes(q)
  );

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="tool-card not-found">
        😔 Sorry, the tool you are finding is not here
      </div>
    `;
    return;
  }

  filtered.forEach(t => {
   grid.innerHTML += `
  <div class="tool-card">
    <div class="tool-preview">
      <img src="${t.image}" alt="${t.name}" loading="lazy">
    </div>
    <h3>${t.name}</h3>
    <a href="${t.link}" class="btn">Open Tool</a>
  </div>
`;

  });
}


/* ===== CATEGORY ===== */
function setCategory(cat, el) {
  activeCategory = cat;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  movePillSlider(el);
  render();
}


/* SEARCH */
document.getElementById("searchInput").addEventListener("input", render);

render();
window.onload = () => {
  const active = document.querySelector(".pill.active");
  movePillSlider(active);
};





function movePillSlider(el) {
  const slider = document.querySelector(".pill-slider");
  slider.style.width = el.offsetWidth + "px";
  slider.style.left = el.offsetLeft + "px";
}

</script>
