<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Document Vault</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #020617;
  color: white;
}

/* COMMON */
.hidden { display: none; }
.error { color: #f87171; }

/* AUTH SCREENS */
.auth-box {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  background: #0f172a;
  padding: 25px;
  width: 320px;
  border-radius: 12px;
  text-align: center;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}

/* NAVBAR */
.navbar {
  background: #020617;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
}

.navbar a {
  margin-right: 15px;
  cursor: pointer;
}

/* DOCUMENTS */
.cards {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
  gap: 16px;
}

.card {
  background: #0f172a;
  border-radius: 12px;
  padding: 10px;
}

.card img {
  width: 100%;
  border-radius: 8px;
}
</style>
</head>

<body>

<!-- STEP 1: ADMIN CODE -->
<div class="auth-box" id="codeScreen">
  <div class="box">
    <h2>Enter Admin Code</h2>
    <input type="password" id="adminCode" placeholder="Admin Code">
    <button onclick="checkCode()">Continue</button>
    <p id="codeError" class="error"></p>
  </div>
</div>

<!-- STEP 2: OTP -->
<div class="auth-box hidden" id="otpScreen">
  <div class="box">
    <h2>Verify OTP</h2>
    <p id="mobileText"></p>
    <input type="text" id="otpInput" placeholder="Enter OTP">
    <button onclick="verifyOTP()">Verify</button>
    <p id="otpError" class="error"></p>
  </div>
</div>

<!-- STEP 3: DOCUMENT DASHBOARD -->
<div id="dashboard" class="hidden">

  <!-- NAVBAR -->
  <div class="navbar">
    <div><b>My Secure Vault</b></div>
    <div>
      <a onclick="showCategory('aadhar')">Aadhar</a>
      <a onclick="showCategory('caste')">Caste</a>
      <a onclick="showCategory('marksheet')">Marksheet</a>
      <a onclick="showCategory('all')">All</a>
    </div>
  </div>

  <!-- DOCUMENTS -->
  <div class="cards">

    <div class="card aadhar">
      <img src="docs/aadhar.jpg" alt="Aadhar">
      <p>Aadhar Card</p>
    </div>

    <div class="card caste">
      <img src="docs/caste.jpg" alt="Caste">
      <p>Caste Certificate</p>
    </div>

    <div class="card marksheet">
      <img src="docs/marksheet.jpg" alt="Marksheet">
      <p>Marksheet</p>
    </div>

  </div>
</div>

<script>
/* ADMIN → MOBILE MAP */
const adminMap = {
  "1234": "9977912974",
  "4321": "8878017278"
};

let generatedOTP = "";

/* STEP 1 */
function checkCode() {
  const code = adminCode.value;
  if (!adminMap[code]) {
    codeError.textContent = "Invalid admin code";
    return;
  }

  codeError.textContent = "";
  codeScreen.classList.add("hidden");
  otpScreen.classList.remove("hidden");

  const mobile = adminMap[code];
  mobileText.textContent = "OTP sent to +91 ******" + mobile.slice(-4);

  generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
  console.log("DEMO OTP:", generatedOTP);
}

/* STEP 2 */
function verifyOTP() {
  if (otpInput.value !== generatedOTP) {
    otpError.textContent = "Invalid OTP";
    return;
  }

  otpError.textContent = "";
  otpScreen.classList.add("hidden");
  dashboard.classList.remove("hidden");
}

/* CATEGORY FILTER */
function showCategory(cat) {
  document.querySelectorAll(".card").forEach(card => {
    card.style.display =
      cat === "all" || card.classList.contains(cat)
        ? "block"
        : "none";
  });
}
</script>

</body>
</html>
